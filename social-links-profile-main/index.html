<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Social links profile</title>
    <link rel="stylesheet" href="./index.css">

</head>

<body>
    <main>
        <div class="card">
            <div class="avatar">
                <img class="avatar-img" alt="avatar-image" src="./assets/images/avatar-jessica.jpeg" />
            </div>
            <div class="name">Jessica Randall</div>
            <div class="address">London, United Kingdom</div>
            <div class="role">"Front-end developer and avid reader."</div>
            <div class="links">
                <button class="btn">GitHub</button>
                <button class="btn">Frontend Mentor</button>
                <button class="btn">LinkedIn</button>
                <button class="btn">Twitter</button>
                <button class="btn">Instagram</button>
            </div>
        </div>
    </main>
</body>

</html>
